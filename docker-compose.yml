services:
  postgres:
    image: postgres:16-alpine
    container_name: matchiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: matchiq
      POSTGRES_PASSWORD: matchiq
      POSTGRES_DB: matchiq
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  browserless:
    image: browserless/chrome:latest
    container_name: matchiq-browserless
    restart: unless-stopped
    ports:
      - '3003:3000'
    environment:
      CONNECTION_TIMEOUT: '300000'
      MAX_CONCURRENT_SESSIONS: '5'
      PREBOOT_CHROME: 'true'
      KEEP_ALIVE: 'true'

volumes:
  pgdata:
